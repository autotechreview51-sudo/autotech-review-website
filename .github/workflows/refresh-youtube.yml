name: Refresh YouTube publication

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-youtube.yml'
      - 'netlify/lib/**'
      - 'scripts/update-youtube.mjs'
      - 'scripts/sync-publication.mjs'
      - 'scripts/update-thumbnails.mjs'
      - 'scripts/build-publication.mjs'
      - 'scripts/search-content.mjs'
      - 'scripts/search-discovery.mjs'

permissions:
  contents: write

concurrency:
  group: refresh-youtube
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test refresh and outage recovery
        run: node scripts/verify-auto-refresh.mjs && node scripts/verify-feed-fallback.mjs && node scripts/verify-search-discovery.mjs
      - name: Refresh channel uploads
        run: node scripts/update-youtube.mjs && node scripts/sync-publication.mjs
      - name: Update exact video thumbnails
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(date -u +%H)" = "14" ]; then
            node scripts/update-thumbnails.mjs --refresh
          else
            node scripts/update-thumbnails.mjs
          fi
      - name: Build publication, RSS and sitemaps
        run: node scripts/build-publication.mjs
      - name: Commit only actual content changes
        id: content
        run: |
          git add data/site-content.json data/publication.json data/cover-provenance.json dist
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          # If an editor changed main, let the next hourly run regenerate from it.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during refresh; skipping this commit safely"
            exit 0
          fi
          git config user.name "AutoTech content bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh channel videos and publication pages"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Notify search engines after new uploads are published
        if: steps.content.outputs.published == 'true'
        run: node scripts/notify-search.mjs --wait
