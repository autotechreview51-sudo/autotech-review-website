name: Refresh YouTube fallback content

on:
  # The live site loads new uploads through the Netlify function (cached about 15 minutes).
  # This daily job only refreshes the static fallback and avoids unnecessary hourly deploys.
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-youtube
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh fallback videos and subscriber count
        run: node scripts/update-youtube.mjs

      - name: Refresh structured publication pages
        run: node scripts/sync-publication.mjs && node scripts/build-publication.mjs

      - name: Commit only real content changes
        run: |
          if git diff --quiet -- data/site-content.json data/publication.json data/cover-provenance.json dist; then
            echo "No content changes"
            exit 0
          fi
          git config user.name "AutoTech content bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-content.json data/publication.json data/cover-provenance.json dist
          git commit -m "Refresh YouTube fallback content"
          git pull --rebase origin main
          git push origin HEAD:main
