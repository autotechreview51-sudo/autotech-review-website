name: Refresh YouTube content

on:
  schedule:
    # Hourly. The live /api/youtube-feed function shows new uploads within ~15 minutes;
    # this keeps data/site-content.json (the fallback + subscriber count) current.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-youtube
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh latest videos and subscriber count
        # The updater keeps the last reliable data whenever YouTube is unavailable.
        run: node scripts/update-youtube.mjs

      - name: Commit only real content changes
        id: commit
        run: |
          if git diff --quiet -- data/site-content.json; then
            echo "No content changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "AutoTech content bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-content.json
          git commit -m "Refresh YouTube content"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Optional. Only needed if Netlify is NOT building from this repo.
      # A Git-connected Netlify site already redeploys on the commit above.
      - name: Deploy to Netlify (optional)
        if: steps.commit.outputs.changed == 'true' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli@latest deploy --prod --dir=. --functions=netlify/functions --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Hourly YouTube refresh"
