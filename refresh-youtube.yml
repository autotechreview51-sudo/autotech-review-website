name: Refresh YouTube content

on:
  schedule:
    # Check hourly so a new upload normally appears on the site within an hour.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh latest videos and subscriber count
        run: node scripts/update-youtube.mjs
      - name: Commit refreshed content
        run: |
          if git diff --quiet -- data/site-content.json; then
            echo "No content changes"
            exit 0
          fi
          git config user.name "AutoTech content bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/site-content.json
          git commit -m "Refresh YouTube content"
          git push
      - name: Deploy the refreshed site to Netlify
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=. --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
